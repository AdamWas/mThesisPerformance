name: thesis-performance

services:
  rest-server:
    image: thesis-performance-rest:local
    build:
      context: .
      dockerfile: Performance/REST/Server/run-docker/dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      PERFORMANCE_REST_URL: http://0.0.0.0:5100
    ports:
      - "5100:5100"
    networks:
      - performance-tests

  grpc-server:
    image: thesis-performance-grpc:local
    build:
      context: .
      dockerfile: Performance/gRPC/Server/run-docker/dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      PERFORMANCE_GRPC_PORT: "5101"
      PERFORMANCE_GRPC_LISTEN_ANY_IP: "true"
    ports:
      - "5101:5101"
    networks:
      - performance-tests

  graftcode-server:
    image: thesis-performance-graftcode:local
    build:
      context: Performance/Graftcode/Server/run-docker
      dockerfile: dockerfile
    ports:
      - "81:81"
      - "5004:5004"
    networks:
      - performance-tests

  python-fastapi-server:
    image: thesis-performance-python-fastapi:local
    build:
      context: .
      dockerfile: Performance/Python/REST/FastAPI/run-docker/dockerfile
    ports:
      - "5200:5200"
    networks:
      - performance-tests

  python-grpc-server:
    image: thesis-performance-python-grpc:local
    build:
      context: .
      dockerfile: Performance/Python/gRPC/run-docker/dockerfile
    environment:
      PERFORMANCE_PYTHON_GRPC_PORT: "5201"
    ports:
      - "5201:5201"
    networks:
      - performance-tests

  python-flask-server:
    image: thesis-performance-python-flask:local
    build:
      context: .
      dockerfile: Performance/Python/REST/Flask/run-docker/dockerfile
    ports:
      - "5202:5202"
    networks:
      - performance-tests

  python-graftcode-server:
    image: thesis-performance-python-graftcode:local
    build:
      context: .
      dockerfile: Performance/Python/Graftcode/Server/run-docker/dockerfile
    ports:
      - "5203:5203"
      - "5204:5204"
    networks:
      - performance-tests

networks:
  performance-tests:
    name: thesis-performance-tests
